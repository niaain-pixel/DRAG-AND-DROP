  <style>
  html, body { height: 100%; margin: 0; padding: 0; }
  * { box-sizing: border-box; }

  :root {
    --bg-color: #E8F8F5;
    --surface-color: #FFFFFF;
    --text-color: #2C3E50;
    --primary-color: #27AE60;
    --secondary-color: #3498DB;
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    overflow-x: hidden;
  }

  .game-title-font {
    font-family: 'Fredoka One', cursive;
  }

  .bubble {
    position: fixed;
    border-radius: 50%;
    opacity: 0.08;
    animation: floatBubble 12s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }
  .bubble:nth-child(1) { width: 120px; height: 120px; left: 5%; top: 10%; background: var(--primary-color); animation-delay: 0s; }
  .bubble:nth-child(2) { width: 80px; height: 80px; right: 10%; top: 30%; background: var(--secondary-color); animation-delay: 3s; }
  .bubble:nth-child(3) { width: 100px; height: 100px; left: 15%; bottom: 20%; background: #F39C12; animation-delay: 6s; }
  .bubble:nth-child(4) { width: 60px; height: 60px; right: 20%; bottom: 15%; background: var(--primary-color); animation-delay: 9s; }

  @keyframes floatBubble {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-30px) scale(1.1); }
  }

  .drag-card {
    cursor: grab;
    transition: transform 0.2s, box-shadow 0.2s;
    user-select: none;
    touch-action: none;
  }
  .drag-card:hover {
    transform: scale(1.08);
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
  }
  .drag-card.dragging {
    opacity: 0.6;
    transform: scale(1.1);
    z-index: 1000;
  }
  .drag-card.correct-flash {
    animation: correctPop 0.6s ease;
  }
  .drag-card.wrong-flash {
    animation: wrongShake 0.5s ease;
  }

  .drop-zone {
    transition: all 0.3s ease;
    border: 3px dashed #BDC3C7;
    min-height: 120px;
  }
  .drop-zone.drag-over {
    border-color: var(--primary-color);
    background: rgba(39,174,96,0.08);
    transform: scale(1.03);
  }
  .drop-zone.correct {
    border-color: var(--primary-color);
    background: rgba(39,174,96,0.15);
    animation: correctPop 0.6s ease;
  }
  .drop-zone.wrong {
    border-color: #E74C3C;
    background: rgba(231,76,60,0.1);
    animation: wrongShake 0.5s ease;
  }

  @keyframes correctPop {
    0% { transform: scale(1); }
    30% { transform: scale(1.15); }
    60% { transform: scale(0.95); }
    100% { transform: scale(1); }
  }
  @keyframes wrongShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-12px); }
    40% { transform: translateX(12px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(8px); }
  }

  .level-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 16px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.9rem;
  }

  .streak-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    transition: all 0.3s;
  }

  .feedback-toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 9999;
    pointer-events: none;
    transition: none;
  }
  .feedback-toast.show {
    animation: toastPop 1.4s ease forwards;
  }
  @keyframes toastPop {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    15% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    30% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    75% { opacity: 1; }
    100% { transform: translate(-50%, -60%) scale(0.8); opacity: 0; }
  }

  .star-rain {
    position: fixed;
    top: -20px;
    font-size: 28px;
    z-index: 9998;
    pointer-events: none;
    animation: starFall 1.8s ease-out forwards;
  }
  @keyframes starFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100%) rotate(360deg); opacity: 0; }
  }

  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    z-index: 9997;
    pointer-events: none;
    animation: confettiFall 2s ease-out forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(600px) rotate(720deg); opacity: 0; }
  }

  .progress-fill {
    transition: width 0.5s ease;
  }

  .page { display: none; }
  .page.active {
    display: flex;
    animation: fadeSlideIn 0.5s ease;
  }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (pointer: coarse) {
    .drag-card { cursor: default; }
  }

  .emoji-icon {
    font-size: 3rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stagger-1 { animation-delay: 0.05s; }
  .stagger-2 { animation-delay: 0.1s; }
  .stagger-3 { animation-delay: 0.15s; }
  .stagger-4 { animation-delay: 0.2s; }

  .card-enter {
    animation: cardEnter 0.4s ease both;
  }
  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(15px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .ending-title-animation {
    animation: titlePulse 0.8s ease-out;
  }
  @keyframes titlePulse {
    0% { transform: scale(0.5); opacity: 0; }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }

  .ending-confetti-animation {
    animation: endingConfetti 3s ease-out forwards;
  }
  @keyframes endingConfetti {
    0% { transform: translateY(-100px) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(600px) rotate(360deg); opacity: 0; }
  }

  .result-card-enter {
    animation: resultCardEnter 0.6s ease-out both;
  }
  @keyframes resultCardEnter {
    0% { opacity: 0; transform: translateY(30px) scale(0.9); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .result-card-enter:nth-child(1) { animation-delay: 0.1s; }
  .result-card-enter:nth-child(2) { animation-delay: 0.2s; }
  .result-card-enter:nth-child(3) { animation-delay: 0.3s; }

  .form-input {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #E0E0E0;
    border-radius: 12px;
    font-size: 1rem;
    font-family: 'Nunito', sans-serif;
    transition: all 0.3s;

  .form-input:focus {

  .student-list-item {

  }
  .student-list-item:hover {

    border-color: var(--primary-color);

  .loading-spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #E0E0E0;
    border-top-color: var(--primary-color);
    border-radius: 50%;
    animation: spin 1s linear infinite;

  @keyframes spin {

  .debug-console {

    border-radius: 5px;
    overflow-y: auto;
    z-index: 99999;
    font-family: monospace;
    display: none;
  }
  .debug-console.active { display: block; }
</style>

// ============================================================

function addDebugLog(msg) {
  const debugEl = document.getElementById('debugConsole');
  if (!debugEl) return;
  const timestamp = new Date().toLocaleTimeString();
  const line = document.createElement('div');
  line.textContent = `[${timestamp}] ${msg}`;
  debugEl.appendChild(line);
  debugEl.scrollTop = debugEl.scrollHeight;
  console.log(msg);
}

function toggleDebug() {
  const debugEl = document.getElementById('debugConsole');
  if (debugEl) {
    debugEl.classList.toggle('active');
  }
}

// Enable debug logging - Press Ctrl+D to toggle
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'd') {
    e.preventDefault();
    toggleDebug();
  }
});

let tahap = 1;

// ============================================================
// CONFIG / SDK

const defaultConfig = {
  game_title: 'Seret & Baca Pintar BM',
  correct_message: 'Bagus! 🌟',
  wrong_message: 'Cuba lagi ya! 💪',
  level_up_message: 'Anda hebat! Naik level! 🎉',

  text_color: '#2C3E50',
  primary_color: '#27AE60',
  secondary_color: '#3498DB',
  font_family: 'Nunito',
  font_size: 16
};

function applyConfig(cfg) {
  const bg = cfg.background_color || defaultConfig.background_color;
  const surface = cfg.surface_color || defaultConfig.surface_color;
  const text = cfg.text_color || defaultConfig.text_color;
  const primary = cfg.primary_color || defaultConfig.primary_color;
  const secondary = cfg.secondary_color || defaultConfig.secondary_color;
  const font = cfg.font_family || defaultConfig.font_family;

  document.documentElement.style.setProperty('--bg-color', bg);
  document.documentElement.style.setProperty('--surface-color', surface);
  document.documentElement.style.setProperty('--text-color', text);
  document.documentElement.style.setProperty('--primary-color', primary);
  document.documentElement.style.setProperty('--secondary-color', secondary);

  document.body.style.background = bg;
  document.body.style.color = text;
  document.body.style.fontFamily = `${font}, Nunito, sans-serif`;

  const titleEl = document.getElementById('mainTitle');
  if (titleEl) titleEl.textContent = cfg.game_title || defaultConfig.game_title;
}

function lighten(hex, amount) {
  const num = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, Math.round((num >> 16) + (255 - (num >> 16)) * amount));
  const g = Math.min(255, Math.round(((num >> 8) & 0x00FF) + (255 - ((num >> 8) & 0x00FF)) * amount));
  const b = Math.min(255, Math.round((num & 0x0000FF) + (255 - (num & 0x0000FF)) * amount));
  return `rgb(${r},${g},${b})`;
}

      uniqueNames.add(record.student_name);
      allStudents.push({

      });

  renderStudentList();

function startGameSession() {
  tahap = 1;
  markah = 0;
  kiraanBetul = 0;
  kiraanSalah = 0;
  tahapTertinggi = 1;
  jumlahSoalan = 0;
  usedQuestions = { 1: [], 2: [], 3: [] };
  isProcessing = false;

  addDebugLog('🎮 Permainan mula');
  updateUI();
  showPage('pageGame');
  janaSoalan();
}

function updateUI() {
  const cfg = (window.elementSdk && window.elementSdk.config) || defaultConfig;
  const primary = cfg.primary_color || defaultConfig.primary_color;
  const secondary = cfg.secondary_color || defaultConfig.secondary_color;

  const badge = document.getElementById('levelBadge');
  if (badge) {
    const stars = '⭐'.repeat(tahap);
    badge.textContent = `${stars} Level ${tahap}`;
    if (tahap === 1) { badge.style.background = lighten(primary, 0.85); badge.style.color = primary; }
    else if (tahap === 2) { badge.style.background = lighten(secondary, 0.85); badge.style.color = secondary; }
    else { badge.style.background = '#FDEBD0'; badge.style.color = '#E67E22'; }
  }

  const scoreEl = document.getElementById('scoreDisplay');
  if (scoreEl) scoreEl.textContent = `Markah: ${markah}`;

  renderStreakDots();

  const maxForLevel = 5;
  const pct = Math.min((kiraanBetul / maxForLevel) * 100, 100);
  const pb = document.getElementById('progressBar');
  if (pb) pb.style.width = `${pct}%`;
}

function renderStreakDots() {
  const container = document.getElementById('streakDots');
  if (!container) return;
  const cfg = (window.elementSdk && window.elementSdk.config) || defaultConfig;
  const primary = cfg.primary_color || defaultConfig.primary_color;
  container.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const dot = document.createElement('div');
    dot.className = 'streak-dot';
    if (i < kiraanBetul) {
      dot.style.background = primary;
      dot.style.boxShadow = `0 0 6px ${primary}`;
    } else {
      dot.style.background = '#D5D8DC';
    }
    container.appendChild(dot);
  }
}

function janaSoalan() {
  const levelData = GAME_DATA[tahap];
  const items = levelData.items;

  let available = items.filter((_, i) => !usedQuestions[tahap].includes(i));
  if (available.length === 0) {
    usedQuestions[tahap] = [];
    available = items;
  }

  const idx = Math.floor(Math.random() * available.length);
  const chosen = available[idx];
  const originalIdx = items.indexOf(chosen);
  usedQuestions[tahap].push(originalIdx);

  currentCorrectEmoji = chosen.emoji;
  currentQuestionWord = chosen.word;

  const arahanEl = document.getElementById('arahanText');
  if (arahanEl) arahanEl.textContent = levelData.arahan;
  const soalanEl = document.getElementById('soalanDisplay');
  if (soalanEl) soalanEl.textContent = chosen.word;

  const dz = document.getElementById('dropZone');
  if (dz) {
    dz.className = 'drop-zone w-full max-w-xs rounded-2xl flex flex-col items-center justify-center mb-6 p-4';
    dz.style.background = 'var(--surface-color)';
    dz.innerHTML = '<span class="text-5xl mb-2 opacity-30">⬇️</span><span class="font-bold opacity-40 text-lg">Lepaskan gambar di sini</span>';
  }

  let emojiPool;
  if (tahap === 1) emojiPool = [...ALL_EMOJIS_L1];
  else if (tahap === 2) emojiPool = [...ALL_EMOJIS_L2];
  else emojiPool = [...ALL_EMOJIS_L3];

  const filteredPool = emojiPool.filter(e => e !== chosen.emoji);
  shuffleArray(filteredPool);
  const distractors = filteredPool.slice(0, 3);
  const options = [chosen.emoji, ...distractors];
  shuffleArray(options);

  renderOptions(options);
  isProcessing = false;
}

function renderOptions(options) {
  const grid = document.getElementById('optionsGrid');
  if (!grid) return;
  grid.innerHTML = '';

  options.forEach((emoji, i) => {
    const card = document.createElement('div');
    card.className = `drag-card card-enter stagger-${i + 1} rounded-2xl flex items-center justify-center p-4 shadow-md`;
    card.style.background = 'var(--surface-color)';
    card.style.width = '100px';
    card.style.height = '100px';
    card.style.boxShadow = '0 4px 15px rgba(0,0,0,0.08)';
    card.setAttribute('draggable', 'true');
    card.setAttribute('data-emoji', emoji);
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `Pilihan gambar ${emoji}`);
    card.innerHTML = `<span class="emoji-icon">${emoji}</span>`;

    card.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', emoji);
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
    });

    let touchClone = null;

    card.addEventListener('touchstart', (e) => {
      if (isProcessing) return;
      const touch = e.touches[0];

      touchClone = card.cloneNode(true);
      touchClone.style.position = 'fixed';
      touchClone.style.zIndex = '10000';
      touchClone.style.pointerEvents = 'none';
      touchClone.style.opacity = '0.85';
      touchClone.style.transform = 'scale(1.15)';
      touchClone.style.width = '100px';
      touchClone.style.height = '100px';
      touchClone.style.left = (touch.clientX - 50) + 'px';
      touchClone.style.top = (touch.clientY - 50) + 'px';
      document.body.appendChild(touchClone);
      card.classList.add('dragging');
    }, { passive: true });

    card.addEventListener('touchmove', (e) => {
      if (!touchClone) return;
      e.preventDefault();
      const touch = e.touches[0];
      touchClone.style.left = (touch.clientX - 50) + 'px';
      touchClone.style.top = (touch.clientY - 50) + 'px';

      const dz = document.getElementById('dropZone');
      if (dz) {
        const rect = dz.getBoundingClientRect();
        if (touch.clientX >= rect.left && touch.clientX <= rect.right && touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
          dz.classList.add('drag-over');
        } else {
          dz.classList.remove('drag-over');
        }
      }
    }, { passive: false });

    card.addEventListener('touchend', (e) => {
      if (!touchClone) return;
      const touch = e.changedTouches[0];
      if (touchClone.parentNode) touchClone.parentNode.removeChild(touchClone);
      touchClone = null;
      card.classList.remove('dragging');

      const dz = document.getElementById('dropZone');
      if (dz) {
        dz.classList.remove('drag-over');
        const rect = dz.getBoundingClientRect();
        if (touch.clientX >= rect.left && touch.clientX <= rect.right && touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
          prosesJawapan(emoji);
        }
      }
    });

    grid.appendChild(card);
  });
}

function handleDragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function handleDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}
function handleDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (isProcessing) return;
  const emoji = e.dataTransfer.getData('text/plain');
  prosesJawapan(emoji);
}

function prosesJawapan(emoji) {
  if (isProcessing) return;
  isProcessing = true;
  jumlahSoalan++;

  const cfg = (window.elementSdk && window.elementSdk.config) || defaultConfig;
  const dz = document.getElementById('dropZone');
  if (!dz) return;

  const betul = emoji === currentCorrectEmoji;

  dz.innerHTML = `<span style="font-size:4rem;">${emoji}</span>`;

  if (betul) {
    markah += (tahap * 10);
    kiraanBetul++;
    kiraanSalah = 0;

    dz.classList.add('correct');
    showFeedback(cfg.correct_message || defaultConfig.correct_message, true);
    spawnStars();

    const cards = document.querySelectorAll('.drag-card');
    cards.forEach(c => {
      if (c.getAttribute('data-emoji') === emoji) c.classList.add('correct-flash');
    });

    if (kiraanBetul >= 5 && tahap < 3) {
      setTimeout(() => {
        tahap++;
        if (tahap > tahapTertinggi) tahapTertinggi = tahap;
        kiraanBetul = 0;
        kiraanSalah = 0;
        showFeedback(cfg.level_up_message || defaultConfig.level_up_message, true);
        spawnConfetti();
        updateUI();
        setTimeout(() => janaSoalan(), 1200);
      }, 1000);
      return;
    }

    if (kiraanBetul >= 5 && tahap === 3) {
      setTimeout(() => {
        tamatPermainanLengkap();
      }, 1000);
      return;
    }

    updateUI();
    setTimeout(() => janaSoalan(), 1200);

  } else {
    kiraanSalah++;
    kiraanBetul = 0;

    dz.classList.add('wrong');
    showFeedback(cfg.wrong_message || defaultConfig.wrong_message, false);

    const cards = document.querySelectorAll('.drag-card');
    cards.forEach(c => {
      if (c.getAttribute('data-emoji') === emoji) c.classList.add('wrong-flash');
    });

    if (kiraanSalah >= 3 && tahap > 1) {
      setTimeout(() => {
        tahap--;
        kiraanBetul = 0;
        kiraanSalah = 0;
        showFeedback('Jom cuba level lebih mudah! 😊', false);
        updateUI();
        setTimeout(() => janaSoalan(), 1200);
      }, 1000);
      return;
    }

    updateUI();
    setTimeout(() => {
      dz.innerHTML = `<span style="font-size:2rem;">Jawapan: </span><span style="font-size:3rem;">${currentCorrectEmoji}</span>`;
      setTimeout(() => janaSoalan(), 1500);
    }, 1200);
  }
}

function showFeedback(message, isPositive) {
  const toast = document.getElementById('feedbackToast');
  const inner = document.getElementById('feedbackInner');
  const cfg = (window.elementSdk && window.elementSdk.config) || defaultConfig;
  const primary = cfg.primary_color || defaultConfig.primary_color;

  if (!toast || !inner) return;

  inner.textContent = message;
  inner.style.background = isPositive ? primary : '#E74C3C';
  inner.style.color = '#FFFFFF';

  toast.classList.remove('show');
  void toast.offsetWidth;
  toast.classList.add('show');

  setTimeout(() => toast.classList.remove('show'), 1500);
}

function spawnStars() {
  const emojis = ['⭐','🌟','✨','💫'];
  for (let i = 0; i < 6; i++) {
    const star = document.createElement('div');
    star.className = 'star-rain';
    star.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    star.style.left = `${10 + Math.random() * 80}%`;
    star.style.animationDelay = `${Math.random() * 0.5}s`;
    star.style.animationDuration = `${1.2 + Math.random() * 1}s`;
    document.body.appendChild(star);
    setTimeout(() => star.remove(), 2500);
  }
}

function spawnConfetti() {
  const colors = ['#E74C3C','#3498DB','#27AE60','#F39C12','#9B59B6','#1ABC9C'];
  for (let i = 0; i < 30; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = `${Math.random() * 100}%`;
    piece.style.top = '-10px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.width = `${6 + Math.random() * 8}px`;
    piece.style.height = `${6 + Math.random() * 8}px`;
    piece.style.animationDelay = `${Math.random() * 0.6}s`;
    piece.style.animationDuration = `${1.5 + Math.random() * 1}s`;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 3000);
  }
}

async function simpanMarkah(student, markahFinal) {
  const googleSheetURL = 'https://script.google.com/macros/s/AKfycbwgI5nFuiuATPpxEtEJeTr2FS_zio0hec72rc3Uz99Pa2MlufIHzaNNp24tycwtvWNs/exec';
  
  addDebugLog(`🚀 SIMPAN MARKAH DIMULAI`);
  addDebugLog(`  Student: ${student.name}`);
  addDebugLog(`  School: ${student.school}`);
  addDebugLog(`  Year: ${student.year}`);
  addDebugLog(`  Markah: ${markahFinal}`);
  
  try {
    const now = new Date();
    const todayDate = now.toLocaleDateString('ms-MY');
    
    const payload = {
      nama: student.name || 'Tidak Diketahui',
      sekolah: student.school || 'Tidak Diketahui',
      tahun: student.year || 'Tidak Diketahui',
      markah: markahFinal || 0,
      tarikh: todayDate
    };

    addDebugLog(`📦 Payload: ${JSON.stringify(payload)}`);
    addDebugLog(`📤 Menghantar ke: ${googleSheetURL}`);

    const response = await fetch(googleSheetURL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify(payload)
    });

    addDebugLog(`📬 Response status: ${response.status}`);
    addDebugLog(`✅ DATA HANTAR KE GOOGLE SHEETS BERJAYA!`);
    
    return { success: true, status: response.status };

  } catch (error) {
    addDebugLog(`❌ ERROR: ${error.message}`);
    addDebugLog(`❌ Stack: ${error.stack}`);
    return { success: false, error: error.message };
  }
}

function saveGameRecord() {
  addDebugLog('💾 SAVE GAME RECORD DIMULAI');
  addDebugLog(`  currentStudent: ${JSON.stringify(currentStudent)}`);
  addDebugLog(`  markah: ${markah}`);
  
  const savingEl = document.getElementById('savingIndicator');
  if (savingEl) {
    savingEl.style.display = 'block';
    addDebugLog('💾 Loading indicator ditunjukkan');
  }

  const now = new Date();
  const todayDate = now.toLocaleDateString('ms-MY');

  // Save to Data SDK
  if (window.dataSdk) {
    addDebugLog('💾 Simpan ke Data SDK...');
    window.dataSdk.create({
      student_name: currentStudent.name,
      school: currentStudent.school,
      year: currentStudent.year,
      score: markah,
      level_achieved: tahapTertinggi,
      questions_answered: jumlahSoalan,
      date_played: todayDate
    }).then(result => {
      if (result.isOk) {
        addDebugLog('✅ Data SDK - BERJAYA SIMPAN');
      } else {
        addDebugLog(`❌ Data SDK - GAGAL: ${result.error}`);
      }
    });
  } else {
    addDebugLog('⚠️ Data SDK tidak tersedia');
  }

  // Save to Google Sheets
  addDebugLog('💾 Panggil simpanMarkah untuk Google Sheets...');
  simpanMarkah(currentStudent, markah).then(result => {
    addDebugLog(`💾 Result dari simpanMarkah: ${JSON.stringify(result)}`);
    if (result.success) {
      addDebugLog('✅ GOOGLE SHEETS - BERJAYA DIHANTAR!');
      showFeedback('✅ Markah disimpan ke Google Sheets!', true);
    } else {
      addDebugLog(`⚠️ GOOGLE SHEETS - GAGAL: ${result.error}`);
      showFeedback('⚠️ Gagal simpan ke Google Sheets', false);
    }
    if (savingEl) {
      savingEl.style.display = 'none';
      addDebugLog('💾 Loading indicator disembunyikan');
    }
  }).catch(err => {
    addDebugLog(`❌ Promise error: ${err.message}`);
    if (savingEl) savingEl.style.display = 'none';
  });
}

function spawnCelebrationConfetti() {
  const colors = ['#E74C3C','#3498DB','#27AE60','#F39C12','#9B59B6','#1ABC9C','#E91E63','#00BCD4'];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'ending-confetti-animation';
    piece.style.left = `${Math.random() * 100}%`;
    piece.style.top = '-30px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.position = 'fixed';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
    piece.style.width = `${8 + Math.random() * 12}px`;
    piece.style.height = `${8 + Math.random() * 12}px`;
    piece.style.zIndex = '9998';
    piece.style.pointerEvents = 'none';
    piece.style.animationDelay = `${Math.random() * 0.8}s`;
    piece.style.animationDuration = `${2 + Math.random() * 1.5}s`;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 4000);
  }
}

function playCompletionAudio() {
  try {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioContext.currentTime;
    const applauseBeeps = [
      { freq: 523.25, time: now, duration: 0.1 },
      { freq: 659.25, time: now + 0.15, duration: 0.1 },
      { freq: 783.99, time: now + 0.3, duration: 0.1 },
      { freq: 1046.50, time: now + 0.45, duration: 0.2 }
    ];

    applauseBeeps.forEach(beep => {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.frequency.value = beep.freq;
      gain.gain.setValueAtTime(0.3, beep.time);
      gain.gain.exponentialRampToValueAtTime(0.01, beep.time + beep.duration);
      osc.start(beep.time);
      osc.stop(beep.time + beep.duration);
    });
  } catch (e) {
    addDebugLog('⚠️ Audio context not available');
  }
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
